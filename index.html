    // INDEXEDDB DATABASE LAYER FOR PREVIEW

    const DB_NAME = 'OSIS_SMEGA_DATABASE';
    const DB_VERSION = 1;

    function openIDB() {
      return new Promise((resolve) => {
        if (!window.indexedDB) {
          resolve(null);
          return;
        }
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('store')) {
            db.createObjectStore('store', { keyPath: 'key' });
          }
        };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = () => resolve(null);
      });
    }

    async function loadIDBData() {
      const db = await openIDB();
      if (!db) return null;
      return new Promise((resolve) => {
        const tx = db.transaction(['store'], 'readonly');
        const req = tx.objectStore('store').get('appData');
        req.onsuccess = () => resolve(req.result ? req.result.value : null);
        req.onerror = () => resolve(null);
      });
    }

    async function saveIDBData(data) {
      const db = await openIDB();
      if (!db) return;
      try {
        const tx = db.transaction(['store'], 'readwrite');
        tx.objectStore('store').put({ key: 'appData', value: data, updatedAt: new Date().toISOString() });
      } catch (e) {
        console.error('IDB save error', e);
      }
    }

    async function getIDBAdminAuth() {
      const db = await openIDB();
      if (!db) {
        return JSON.parse(localStorage.getItem('smega_admin_auth') || '{"username":"admin","password":"smega2026"}');
      }
      return new Promise((resolve) => {
        const tx = db.transaction(['store'], 'readonly');
        const req = tx.objectStore('store').get('auth');
        req.onsuccess = () => {
          if (req.result) resolve(req.result.value);
          else resolve({ username: 'admin', password: 'smega2026' });
        };
        req.onerror = () => resolve({ username: 'admin', password: 'smega2026' });
      });
    }

    async function saveIDBAdminAuth(authObj) {
      localStorage.setItem('smega_admin_auth', JSON.stringify(authObj));
      const db = await openIDB();
      if (!db) return;
      try {
        const tx = db.transaction(['store'], 'readwrite');
        tx.objectStore('store').put({ key: 'auth', value: authObj });
      } catch (e) {}
    }

                      <h3 className="text-lg font-black mt-3 leading-snug">{item.judul}</h3>

                      <span className="text-[10px] text-slate-400 font-bold block mt-4 pt-3 border-t">📅 {item.tanggal}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ---------------- 10. ASPIRASI ---------------- */}
            {currentPage === 'aspirasi' && (
              <div className="pt-28 pb-20 px-4 sm:px-8 max-w-7xl mx-auto">
                <div className="bg-electric text-white rounded-[40px] p-8 sm:p-14 border-3 border-slate-950 shadow-2xl text-center">
                  <span className="text-xs font-black uppercase text-lime tracking-widest block mb-2">KOTAK SUARA DIGITAL</span>
                  <h1 className="text-4xl sm:text-6xl font-black">YOUR VOICE MATTERS.</h1>
                  <p className="mt-3 text-sm sm:text-lg font-bold text-white/90 max-w-lg mx-auto">
                    Punya ide? Ada kritik? Atau punya sesuatu yang ingin kamu sampaikan?
                  </p>
                  <button
                    onClick={() => setIsAspirasiModalOpen(true)}
                    className="mt-6 bg-lime text-slate-950 font-black text-base px-8 py-4 rounded-full border-2 border-slate-950 shadow-lime-glow hover:scale-105 transition-all"
                  >
                    Kirim Aspirasi →
                  </button>
                </div>

                <div className="mt-14">
                  <h3 className="text-2xl font-black text-slate-950 mb-6">Suara Siswa Masuk</h3>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {appData.aspirasiList.map(item => (
                      <div key={item.id} className="bg-white rounded-3xl p-6 border-2 border-slate-900 shadow-card-overlap">
                        <div className="flex justify-between items-center mb-2">
                          <span className="bg-lime text-slate-950 font-black text-[10px] px-2.5 py-0.5 rounded-full border">{item.kategori}</span>
                          <span className="text-[10px] text-electric font-black">{item.status || 'DITINDAKLANJUTI'}</span>
                        </div>
                        <p className="text-xs sm:text-sm font-bold text-slate-800 italic mt-3">“{item.pesan}”</p>
                        <p className="text-xs font-semibold text-slate-500 mt-3">— {item.nama} ({item.kelas})</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* ---------------- 11. KONTAK ---------------- */}
            {currentPage === 'kontak' && (
              <div className="pt-28 pb-20 px-4 sm:px-8 max-w-7xl mx-auto">
                <span className="bg-electric text-lime font-black text-xs px-3.5 py-1.5 rounded-full uppercase">PUSAT HUBUNGAN</span>
                <h1 className="text-4xl sm:text-6xl font-black text-slate-950 mt-3">LET'S CONNECT</h1>
                <div className="mt-10 grid grid-cols-1 md:grid-cols-2 gap-8">
                  <div className="bg-slate-950 text-white rounded-[36px] p-8 border-3 border-slate-950">
                    <span className="bg-lime text-slate-950 text-xs font-black px-3 py-1 rounded-full uppercase">SEKRETARIAT</span>
                    <h3 className="text-2xl font-black mt-4">OSIS {appData.osisInfo.namaSekolah}</h3>
                    <div className="mt-6 space-y-3 text-xs sm:text-sm text-slate-300">
                      <p>📍 <strong>Alamat:</strong> {appData.osisInfo.alamat}</p>
                      <p>📞 <strong>WhatsApp:</strong> {appData.osisInfo.kontak.whatsapp}</p>
                      <p>✉️ <strong>Email:</strong> {appData.osisInfo.kontak.email}</p>
                      <p>🌐 <strong>Website:</strong> <a href={appData.osisInfo.kontak.websiteSekolah} className="text-lime">{appData.osisInfo.kontak.websiteSekolah}</a></p>
                    </div>
                  </div>

                  <div className="bg-white rounded-[36px] p-8 border-3 border-slate-950 shadow-card-overlap">
                    <h3 className="text-2xl font-black text-slate-950">Media Sosial Resmi</h3>
                    <div className="mt-6 space-y-3">
                      <a href="https://instagram.com" target="_blank" className="block p-3 rounded-2xl bg-slate-50 border font-bold text-xs text-slate-800">
                        📸 Instagram: {appData.osisInfo.kontak.instagram}
                      </a>
                      <a href={appData.osisInfo.kontak.websiteSekolah} target="_blank" className="block p-3 rounded-2xl bg-slate-50 border font-bold text-xs text-slate-800">
                        🌐 Website Sekolah: smkn1purbalingga.sch.id
                      </a>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="bg-slate-950 text-white pt-16 pb-10 px-4 sm:px-8 border-t-3 border-slate-900 mt-12">
            <div className="max-w-7xl mx-auto">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 pb-12 border-b border-white/10">
                <div className="lg:col-span-5">
                  <h3 className="text-xl font-black">OSIS {appData.osisInfo.namaSekolah}</h3>
                  <p className="text-xs text-lime font-bold">{appData.osisInfo.namaKabinet} • {appData.osisInfo.periode}</p>
                  <p className="text-xs text-slate-400 mt-2 max-w-sm">“{appData.osisInfo.tagline}” — Dahulu SMEA Negeri Purbalingga.</p>
                </div>
                <div className="lg:col-span-3">
                  <h4 className="text-xs font-black uppercase text-lime mb-3">PORTAL MENU</h4>
                  <div className="grid grid-cols-2 gap-2 text-xs font-bold text-slate-300">
                    {navList.map(n => (
                      <button key={n.id} onClick={() => navigateTo(n.id)} className="text-left hover:text-lime">{n.label}</button>
                    ))}
                    <button onClick={() => navigateTo('admin')} className="text-left text-lime font-black">⚙️ ADMIN</button>
                  </div>
                </div>
                <div className="lg:col-span-4 bg-white/5 border border-white/10 rounded-2xl p-4 text-xs text-slate-300">
                  <h4 className="font-black text-lime uppercase mb-1">LOKASI</h4>
                  <p>{appData.osisInfo.alamat}</p>
                  <p className="mt-2">WhatsApp: {appData.osisInfo.kontak.whatsapp}</p>
                </div>
              </div>
              <div className="pt-6 text-center text-xs text-slate-500 font-bold">
                © 2026/2027 OSIS SMKN 1 Purbalingga (SMEGA). Hak cipta dilindungi.
              </div>
            </div>
          </footer>

          {/* MODAL ASPIRASI */}
          {isAspirasiModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/75 backdrop-blur-md" onClick={() => setIsAspirasiModalOpen(false)}>
              <div className="relative w-full max-w-lg bg-white rounded-[36px] border-3 border-slate-950 p-6 sm:p-8" onClick={e => e.stopPropagation()}>
                <button onClick={() => setIsAspirasiModalOpen(false)} className="absolute top-5 right-5 w-8 h-8 rounded-full bg-slate-100 font-bold">✕</button>
                <span className="bg-lime text-slate-950 text-xs font-black px-3 py-1 rounded-full border border-slate-950">FORM ASPIRASI SISWA</span>
                <h3 className="text-2xl font-black text-slate-950 mt-2">Suaramu, Perubahan SMEGA.</h3>
                
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const newPost = {
                    id: Date.now(),
                    nama: form.nama.value || "Siswa SMEGA (Anonim)",
                    kelas: form.kelas.value,
                    kategori: form.kategori.value,
                    pesan: form.pesan.value,
                    likes: 1,
                    status: "BARU MASUK",
                    waktu: "Baru saja"
                  };
                  setAppData({ ...appData, aspirasiList: [newPost, ...appData.aspirasiList] });
                  setIsAspirasiModalOpen(false);
                  alert("Aspirasi berhasil dikirim! Terima kasih sudah ikut berkontribusi untuk SMEGA.");
                }} className="mt-4 space-y-3">
                  <div>
                    <label className="block text-xs font-black uppercase text-slate-900 mb-1">Kategori</label>
                    <select name="kategori" className="w-full text-xs font-bold p-2.5 rounded-xl border-2 border-slate-900 bg-white">
                      <option>IDE</option>
                      <option>SARAN</option>
                      <option>KRITIK</option>
                      <option>KEGIATAN</option>
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-black uppercase text-slate-900 mb-1">Nama (Opsional)</label>
                      <input name="nama" type="text" placeholder="Bisa dikosongkan" className="w-full text-xs font-bold p-2.5 rounded-xl border-2 border-slate-900" />
                    </div>
                    <div>
                      <label className="block text-xs font-black uppercase text-slate-900 mb-1">Kelas</label>
                      <input name="kelas" required type="text" placeholder="Contoh: XI RPL 2" className="w-full text-xs font-bold p-2.5 rounded-xl border-2 border-slate-900" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-black uppercase text-slate-900 mb-1">Isi Aspirasi</label>
                    <textarea name="pesan" required rows={3} placeholder="Tuliskan ide atau saranmu..." className="w-full text-xs font-bold p-3 rounded-xl border-2 border-slate-900 resize-none" />
                  </div>
                  <button type="submit" className="w-full bg-electric text-lime font-black text-sm py-3.5 rounded-xl border-2 border-slate-950 shadow-pop">
                    KIRIM ASPIRASI SEKARANG →
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Member Modal */}
          {selectedMember && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/75 backdrop-blur-md" onClick={() => setSelectedMember(null)}>
              <div className="relative w-full max-w-lg bg-white rounded-[36px] border-3 border-slate-950 p-6 sm:p-8" onClick={e => e.stopPropagation()}>
                <button onClick={() => setSelectedMember(null)} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 font-bold">✕</button>
                <div className="flex gap-4 items-center">
                  <div className="w-24 h-28 rounded-2xl overflow-hidden border-2 border-slate-950 bg-slate-100 flex-shrink-0">
                    <img src={selectedMember.foto} alt="" className="w-full h-full object-cover" />
                  </div>
                  <div>
                    <span className="bg-lime text-slate-950 font-black text-[10px] px-2.5 py-0.5 rounded-full border">{selectedMember.sekbidCode}</span>
                    <h3 className="text-xl font-black text-slate-950 mt-1">{selectedMember.nama}</h3>
                    <p className="text-xs font-black text-electric uppercase">{selectedMember.jabatan} • {selectedMember.kelas}</p>
                  </div>
                </div>
                <div className="mt-4 bg-slate-50 rounded-2xl p-3 border text-xs italic font-bold text-slate-800">
                  “{selectedMember.quote}”
                </div>
                <div className="mt-6 flex justify-end">
                  <button onClick={() => setSelectedMember(null)} className="bg-slate-950 text-lime font-black text-xs px-4 py-2 rounded-xl">Tutup</button>
                </div>
              </div>
            </div>
          )}

          {/* Change Password Modal */}
          {isChangePassOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/75 backdrop-blur-md" onClick={() => setIsChangePassOpen(false)}>
              <div className="relative w-full max-w-md bg-white rounded-[36px] border-3 border-slate-950 p-6 sm:p-8" onClick={e => e.stopPropagation()}>
                <button onClick={() => setIsChangePassOpen(false)} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 font-bold hover:bg-slate-200">✕</button>
                <span className="bg-lime text-slate-950 text-[10px] font-black px-3 py-1 rounded-full border border-slate-950 uppercase">KEAMANAN AKUN</span>
                <h3 className="text-2xl font-black text-slate-950 mt-2">Ganti Kata Sandi Admin</h3>
                <p className="text-xs text-slate-500 font-semibold mt-1">Perubahan akan langsung disimpan ke database IndexedDB.</p>

                {passError && (
                  <div className="mt-3 p-3 rounded-xl bg-rose-50 border border-rose-400 text-rose-700 text-xs font-bold">
                    {passError}
                  </div>
                )}

                <form onSubmit={handlePasswordChangeSubmit} className="mt-4 space-y-3">
                  <div>
                    <label className="block text-[11px] font-black uppercase text-slate-800 mb-1">Kata Sandi Lama</label>
                    <input
                      type="password"
                      required
                      value={oldPassInput}
                      onChange={e => setOldPassInput(e.target.value)}
                      placeholder="Masukkan kata sandi lama"
                      className="w-full text-xs font-bold p-3 rounded-xl border-2 border-slate-900 bg-slate-50"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] font-black uppercase text-slate-800 mb-1">Kata Sandi Baru (Min. 6 Karakter)</label>
                    <input
                      type="password"
                      required
                      value={newPassInput}
                      onChange={e => setNewPassInput(e.target.value)}
                      placeholder="Masukkan kata sandi baru"
                      className="w-full text-xs font-bold p-3 rounded-xl border-2 border-slate-900 bg-slate-50"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-3">
                    <button
                      type="button"
                      onClick={() => setIsChangePassOpen(false)}
                      className="bg-slate-100 text-slate-700 font-bold text-xs px-4 py-2.5 rounded-xl hover:bg-slate-200"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="bg-electric text-lime font-black text-xs px-5 py-2.5 rounded-xl border-2 border-slate-900 shadow-pop"
                    >
                      Simpan ke Database ✓
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
